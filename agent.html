.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:14px}

.tl .it{position:relative;padding:0 0 14px}

    if (!n || !b) { $('sfE').textContent = t('needAll'); return; } if (!/^[a-z0-9_]{3,20}$/.test(u)) { $('sfE').textContent = t('userHint'); return; } if (p.length < 6) { $('sfE').textContent = t('pwHint'); return; }
    $('sfGo').disabled = true; var fail = function (m) { $('sfGo').disabled = false; $('sfE').textContent = m || t('failed'); };
    db.ref('login/' + u).once('value').then(function (s) {
      if (s.exists()) { fail(t('userUsed')); return; }
      var email = u + '@' + MAILD;
      return mkAuthUser(email, p).then(function (uid) { var up = {}; up['staff/' + uid] = { name: n, username: u, role: r, branch: b, active: true, at: Date.now() }; up['login/' + u] = { e: email }; return db.ref().update(up); }).then(function () { closeDlg(); toast(t('staffAdded')); loadStaff(); });
    }).catch(function (e) { fail(e && e.code === 'auth/email-already-in-use' ? t('userUsed') : t('failed')); });
  };
}
function staffEdit(uid) {
  var x = staffCache[uid];
  dlg('<h2>' + esc(t('edit')) + '</h2><div class="fg"><label>' + esc(t('name')) + '</label><input id="seN" value="' + esc(x.name) + '"></div><div class="grid2"><div class="fg"><label>' + esc(t('role')) + '</label><select id="seR"><option value="agent"' + (x.role === 'agent' ? ' selected' : '') + '>' + esc(t('agent')) + '</option><option value="admin"' + (x.role === 'admin' ? ' selected' : '') + '>' + esc(t('admin')) + '</option></select></div><div class="fg"><label>' + esc(t('branch')) + '</label><select id="seB">' + branchOpts(x.branch) + '</select></div></div><div class="acts"><button class="btn gray" onclick="closeDlg()">' + esc(t('cancel')) + '</button><button class="btn" id="seGo">' + esc(t('save')) + '</button></div>');
  $('seGo').onclick = function () { if (uid === me.uid && $('seR').value !== 'admin') { toast(t('cantSelf'), false); return; } var up = {}; up['staff/' + uid + '/name'] = $('seN').value.trim() || x.name; up['staff/' + uid + '/role'] = $('seR').value; up['staff/' + uid + '/branch'] = $('seB').value; db.ref().update(up).then(function () { closeDlg(); toast(t('saved')); loadStaff(); }).catch(function () { toast(t('failed'), false); }); };
}
function staffToggle(uid) { if (uid === me.uid) { toast(t('cantSelf'), false); return; } db.ref('staff/' + uid + '/active').set(!staffCache[uid].active).then(loadStaff).catch(function () { toast(t('failed'), false); }); }
function staffPw(uid) {
  var x = staffCache[uid];
  dlg('<h2>' + esc(t('resetPw')) + ' · ' + esc(x.username) + '</h2><div class="fg"><label>' + esc(t('newPw')) + '</label><input id="rpP" type="text"><div class="muted">' + esc(t('pwHint')) + '</div></div><div class="err" id="rpE"></div><div class="acts"><button class="btn gray" onclick="closeDlg()">' + esc(t('cancel')) + '</button><button class="btn" id="rpGo">' + esc(t('save')) + '</button></div>');
  $('rpGo').onclick = function () {
    var p = $('rpP').value; if (p.length < 6) { $('rpE').textContent = t('pwHint'); return; } $('rpGo').disabled = true;
    var email = x.username + '.' + Math.random().toString(36).slice(2, 7) + '@' + MAILD;
    mkAuthUser(email, p).then(function (nu) { var up = {}, rec = Object.assign({}, x); delete rec.uid; up['staff/' + nu] = rec; up['staff/' + uid] = null; up['login/' + x.username] = { e: email }; return db.ref().update(up); }).then(function () { closeDlg(); toast(t('pwDone')); loadStaff(); }).catch(function () { $('rpGo').disabled = false; $('rpE').textContent = t('failed'); });
  };
}
if (typeof document !== 'undefined') document.addEventListener('DOMContentLoaded', boot);

</script>
