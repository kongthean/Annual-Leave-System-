<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Agent - Cambodia Insight Express</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Khmer","Khmer OS System","Noto Sans SC","Microsoft YaHei",sans-serif;background:#eef2f7;color:#0f172a;font-size:15px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.grad{background:linear-gradient(135deg,#0b1d3a 0%,#24406e 100%);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:0;border-radius:10px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#0b1d3a 0%,#24406e 100%);color:#fff;font-size:14px}
.btn.green{background:linear-gradient(135deg,#064e3b 0%,#15906b 100%)}
.btn.red{background:linear-gradient(135deg,#6b0f2a 0%,#d63a62 100%)}
.btn.gray{background:#e2e8f0;color:#334155}
.btn.small{padding:6px 12px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-size:15px}
textarea{min-height:60px;resize:vertical}
label{display:block;font-size:12px;font-weight:700;color:#334155;margin:0 0 4px}
.fg{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(15,23,42,.07);margin-bottom:14px}
h2{margin:0 0 12px;font-size:18px}
h3{margin:0 0 10px;font-size:15px}
.muted{color:#64748b;font-size:12px}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{width:100%;max-width:380px}
#login .logo{font-size:22px;font-weight:800;text-align:center;margin-bottom:2px;color:#0b1d3a}
#login .role{text-align:center;color:#64748b;margin-bottom:18px;font-weight:600}
.err{color:#dc2626;font-size:13px;margin:8px 0;min-height:18px}
header.top{position:sticky;top:0;z-index:20;padding:10px 14px;display:flex;align-items:center;gap:10px}
header.top .ttl{font-weight:800;font-size:16px;flex:1;min-width:0}
header.top .ttl small{display:block;font-weight:500;opacity:.8;font-size:11px}
header.top select{width:auto;padding:5px 8px;font-size:12px;border-radius:8px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35)}
header.top select option{color:#0f172a}
.ib{position:relative;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px}
.badge{position:absolute;top:-6px;right:-6px;background:#dc2626;color:#fff;border-radius:10px;min-width:18px;height:18px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:#fff;box-shadow:0 1px 4px rgba(15,23,42,.08);position:sticky;top:54px;z-index:19}
nav.tabs button{flex:0 0 auto;border:0;background:#e2e8f0;color:#334155;padding:9px 14px;border-radius:20px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
nav.tabs button.on{background:linear-gradient(135deg,#0b1d3a 0%,#24406e 100%);color:#fff}
main{max-width:980px;margin:0 auto;padding:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{border-radius:12px;padding:12px;color:#fff;cursor:pointer}
.stat b{display:block;font-size:26px}
.stat span{font-size:12px;font-weight:600}
.st{display:inline-block;padding:3px 9px;border-radius:12px;color:#fff;font-size:11px;font-weight:700;white-space:nowrap}
.row{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #eef2f7;cursor:pointer}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .no{font-weight:800;font-size:14px}
.row .sub{color:#64748b;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters>*{flex:1;min-width:130px}
.tl{border-left:3px solid #cbd5e1;margin:8px 0 0 6px;padding-left:14px}
.tl .it{position:relative;padding:0 0 14px}
.tl .it:before{content:"";position:absolute;left:-21px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--c,#64748b)}
.tl .it b{font-size:14px}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto}
.dlg{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:520px;margin:auto 0}
.dlg h2{margin-bottom:10px}
.dlg .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.dlg .acts .btn{flex:1;min-width:110px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:12px 18px;border-radius:12px;color:#fff;font-weight:600;z-index:90;max-width:90%;text-align:center}
.toast.ok{background:#15803d}.toast.bad{background:#b91c1c}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{background:#f1f5f9;text-align:left;padding:8px;font-size:12px}
table.tb td{padding:8px;border-bottom:1px solid #eef2f7;vertical-align:middle}
.sc-log{margin-top:10px}
.sc-log div{padding:8px 10px;border-radius:8px;margin-bottom:6px;font-size:13px;font-weight:600}
.sc-log .g{background:#dcfce7;color:#166534}.sc-log .r{background:#fee2e2;color:#991b1b}.sc-log .y{background:#fef9c3;color:#854d0e}
#reader{width:100%;max-width:380px;margin:10px auto;border-radius:12px;overflow:hidden}
.nl{padding:10px;border-bottom:1px solid #eef2f7;cursor:pointer}.nl.un{background:#eff6ff}
/* label (screen preview + print) */
.lab{border:2px solid #000;border-radius:6px;padding:10px;width:100%;max-width:400px;margin:0 auto 12px;background:#fff;color:#000;font-size:12px}
.lab .h{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:6px;font-weight:800}
.lab .c{font-size:10px;border:1px solid #000;padding:1px 5px;border-radius:3px}
.lab .qrw{display:flex;gap:10px;align-items:center}
.lab .no{font-size:18px;font-weight:900;letter-spacing:.5px}
.lab .rt{font-size:15px;font-weight:800;margin:4px 0}
.lab table{width:100%;border-collapse:collapse;margin-top:6px}
.lab td{padding:2px 0;vertical-align:top}
.lab td:first-child{width:78px;font-weight:700}
#printArea{display:none}
@media print{
 body>*:not(#printArea){display:none!important}
 body{background:#fff}
 #printArea{display:block!important}
 #printArea .lab{max-width:none;width:100%;page-break-inside:avoid;margin:0 0 10mm}
 @page{size:A4;margin:10mm}
}
</style>
</head>

function startScan() {
  if (!window.Html5Qrcode) { logScan('y', t('noCamera')); return; }
  try { scanner = new Html5Qrcode('reader'); scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 220 }, function (txt) { handleCode(txt); }, function () {}).then(function () { var b = $('scBtn'); if (b) b.textContent = t('scanStop'); }).catch(function () { scanner = null; logScan('y', t('noCamera')); });
  } catch (e) { scanner = null; logScan('y', t('noCamera')); }
}
function stopScan() { if (!scanner) return; var s = scanner; scanner = null; try { s.stop().then(function () { s.clear(); }).catch(function () {}); } catch (e) {} var b = $('scBtn'); if (b) b.textContent = t('scanStart'); }
function handleCode(txt) {
  var no = parseNo(txt), now = Date.now();
  if (!no) { beep(false); logScan('r', t('unknownCode') + ': ' + String(txt).slice(0, 30)); return; }
  if (no === lastCode && now - lastAt < 4000) return; lastCode = no; lastAt = now;
  var action = ($('scAct') || {}).value || 'received';
  db.ref('shipments/' + no).once('value').then(function (s) {
    var r = s.val(); if (!r) { beep(false); logScan('r', no + ' · ' + t('notFound')); return; } r.no = no;
    if (r.status === action) { beep(false); logScan('y', no + ' · ' + t('sAlready') + ' (' + t(SK[action]) + ')'); return; }
    if (allowedStatuses(r).indexOf(action) < 0) { beep(false); logScan('r', no + ' · ' + t('wrongBranch') + ' (' + r.fromName + ' → ' + r.toName + ')'); return; }
    return applyStatus(r, action, null).then(function () { beep(true); logScan('g', no + ' · ' + t(SK[action]) + ' ✓ (' + r.fromName + ' → ' + r.toName + ')'); });
  }).catch(function () { beep(false); logScan('r', no + ' · ' + t('notFound')); });
}

/* ---------- bell ---------- */
function inboxList() { return Object.keys(inbox).map(function (k) { var x = inbox[k]; x.__k = k; return x; }).sort(function (a, b) { return b.at - a.at; }); }
function renderBell() { var n = inboxList().filter(function (x) { return !x.seen; }).length, b = $('bellN'); if (!b) return; b.textContent = n; b.classList.toggle('hide', !n); }
function bellText(x) { if (x.k === 'new') return t('newGoods'); if (x.k === 'transit') return t('onWay'); return t(SK[x.s] || 'sReceived'); }
function openBell() {
  var l = inboxList().slice(0, 30);
  dlg('<h2>' + esc(t('bell')) + '</h2>' + (l.length ? l.map(function (x) { return '<div class="nl ' + (x.seen ? '' : 'un') + '" onclick="openNote(\'' + esc(x.__k) + '\')"><b>' + esc(bellText(x)) + '</b> · ' + esc(x.no) + '<div class="muted">' + esc(x.from) + ' → ' + esc(x.to) + ' · ' + esc(fmtDT(x.at)) + '</div></div>'; }).join('') : '<div class="muted">' + esc(t('noNotes')) + '</div>') + '<div class="acts"><button class="btn gray" onclick="closeDlg()">' + esc(t('close')) + '</button></div>');
}
function openNote(k) { var x = inbox[k]; if (x && !x.seen) db.ref('inbox/' + me.branch + '/' + k + '/seen').set(true); if (x) openShip(x.no); }

/* ---------- menu / password ---------- */
function openMenu() { dlg('<h2>' + esc(me.name) + '</h2><div class="muted" style="margin-bottom:10px">' + esc(me.username) + '</div><div class="acts" style="flex-direction:column"><button class="btn gray" onclick="pwDlg()">' + esc(t('changePw')) + '</button><button class="btn red" onclick="closeDlg();logout()">' + esc(t('logout')) + '</button><button class="btn gray" onclick="closeDlg()">' + esc(t('close')) + '</button></div>'); }
function pwDlg() {
  dlg('<h2>' + esc(t('changePw')) + '</h2><div class="fg"><label>' + esc(t('oldPw')) + '</label><input id="pwO" type="password"></div><div class="fg"><label>' + esc(t('newPw')) + '</label><input id="pwN" type="password"><div class="muted">' + esc(t('pwHint')) + '</div></div><div class="err" id="pwE"></div><div class="acts"><button class="btn gray" onclick="closeDlg()">' + esc(t('cancel')) + '</button><button class="btn" id="pwGo">' + esc(t('save')) + '</button></div>');
  $('pwGo').onclick = function () {
    var o = $('pwO').value, n = $('pwN').value; if (n.length < 6) { $('pwE').textContent = t('pwHint'); return; }
    var u = auth.currentUser; $('pwGo').disabled = true;
    u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, o)).then(function () { return u.updatePassword(n); }).then(function () { closeDlg(); toast(t('pwDone')); }).catch(function (e) { $('pwGo').disabled = false; $('pwE').textContent = (e && (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential' || e.code === 'auth/invalid-login-credentials')) ? t('pwWrong') : t('failed'); });
  };
}

/* ---------- branches (admin) ---------- */
function branchesHtml() {
  var l = Object.keys(branches).sort().map(function (c) { return branches[c]; });
  return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="margin:0">' + esc(t('branches')) + '</h2><button class="btn small" onclick="branchDlg()">+ ' + esc(t('addBranch')) + '</button></div><table class="tb"><tr><th>' + esc(t('code')) + '</th><th>' + esc(t('name')) + '</th><th>' + esc(t('phone')) + '</th><th></th></tr>' + l.map(function (b) { return '<tr><td><b>' + esc(b.code) + '</b></td><td>' + esc(b.name) + '<div class="muted">' + esc(b.address || '') + '</div></td><td>' + esc(b.phone || '') + '</td><td style="white-space:nowrap"><button class="btn small gray" onclick="branchDlg(\'' + esc(b.code) + '\')">' + esc(t('edit')) + '</button> <button class="btn small ' + (b.active === false ? 'green' : 'red') + '" onclick="branchToggle(\'' + esc(b.code) + '\')">' + esc(b.active === false ? t('turnOn') : t('turnOff')) + '</button></td></tr>'; }).join('') + '</table></div>';
}
function branchDlg(code) {
  var b = code ? branches[code] : null;
  dlg('<h2>' + esc(b ? t('editBranch') : t('addBranch')) + '</h2><div class="fg"><label>' + esc(t('code')) + '</label><input id="bgC" maxlength="4" value="' + esc(b ? b.code : '') + '"' + (b ? ' disabled' : '') + ' style="text-transform:uppercase"><div class="muted">' + esc(t('codeHint')) + '</div></div><div class="fg"><label>' + esc(t('name')) + '</label><input id="bgN" value="' + esc(b ? b.name : '') + '"></div><div class="fg"><label>' + esc(t('address')) + '</label><input id="bgA" value="' + esc(b ? b.address || '' : '') + '"></div><div class="fg"><label>' + esc(t('phone')) + '</label><input id="bgP" value="' + esc(b ? b.phone || '' : '') + '"></div><div class="err" id="bgE"></div><div class="acts"><button class="btn gray" onclick="closeDlg()">' + esc(t('cancel')) + '</button><button class="btn" id="bgGo">' + esc(t('save')) + '</button></div>');
  $('bgGo').onclick = function () {
    var c = (b ? b.code : $('bgC').value.trim().toUpperCase()), n = $('bgN').value.trim();
    if (!/^[A-Z0-9]{2,4}$/.test(c) || !n) { $('bgE').textContent = t('needAll'); return; }
    if (!b && branches[c]) { $('bgE').textContent = t('codeUsed'); return; }
    var rec = { code: c, name: n, address: $('bgA').value.trim(), phone: $('bgP').value.trim(), active: b ? b.active !== false : true, at: b ? b.at || Date.now() : Date.now() };
    $('bgGo').disabled = true; db.ref('branches/' + c).set(rec).then(function () { closeDlg(); toast(t('saved')); }).catch(function () { $('bgGo').disabled = false; toast(t('failed'), false); });
  };
}
function branchToggle(c) { var b = branches[c]; db.ref('branches/' + c + '/active').set(b.active === false).catch(function () { toast(t('failed'), false); }); }

/* ---------- staff (admin) ---------- */
function loadStaff() { db.ref('staff').once('value').then(function (s) { staffCache = s.val() || {}; var el = $('stList'); if (el && tab === 'staff') el.innerHTML = staffHtml(); }); }
function staffHtml() {
  var l = Object.keys(staffCache).map(function (k) { var x = staffCache[k]; x.uid = k; return x; }).sort(function (a, b) { return (a.name || '').localeCompare(b.name || ''); });
  return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="margin:0">' + esc(t('staff')) + '</h2><button class="btn small" onclick="staffDlg()">+ ' + esc(t('addStaff')) + '</button></div><table class="tb"><tr><th>' + esc(t('name')) + '</th><th>' + esc(t('role')) + '</th><th>' + esc(t('branch')) + '</th><th></th></tr>' + l.map(function (x) { return '<tr><td><b>' + esc(x.name) + '</b><div class="muted">' + esc(x.username) + '</div></td><td>' + esc(t(x.role === 'admin' ? 'admin' : 'agent')) + '</td><td>' + esc(bName(x.branch)) + '</td><td style="white-space:nowrap"><button class="btn small gray" onclick="staffEdit(\'' + x.uid + '\')">' + esc(t('edit')) + '</button> <button class="btn small gray" onclick="staffPw(\'' + x.uid + '\')">' + esc(t('resetPw')) + '</button> <button class="btn small ' + (x.active ? 'red' : 'green') + '" onclick="staffToggle(\'' + x.uid + '\')">' + esc(x.active ? t('turnOff') : t('turnOn')) + '</button></td></tr>'; }).join('') + '</table></div>';
}
var secApp = null;
function secAuth() { if (!secApp) secApp = firebase.initializeApp(FBCFG, 'sec'); return secApp.auth(); }
function mkAuthUser(email, pw) { var a = secAuth(); return a.createUserWithEmailAndPassword(email, pw).then(function (c) { var uid = c.user.uid; return a.signOut().then(function () { return uid; }); }); }
function roleBranchOpts(role, br) { return branchOpts(br); }
function staffDlg() {
  dlg('<h2>' + esc(t('addStaff')) + '</h2><div class="fg"><label>' + esc(t('name')) + '</label><input id="sfN"></div><div class="fg"><label>' + esc(t('username')) + '</label><input id="sfU" autocapitalize="none"><div class="muted">' + esc(t('userHint')) + '</div></div><div class="fg"><label>' + esc(t('password')) + '</label><input id="sfP" type="text"><div class="muted">' + esc(t('pwHint')) + '</div></div><div class="grid2"><div class="fg"><label>' + esc(t('role')) + '</label><select id="sfR"><option value="agent">' + esc(t('agent')) + '</option><option value="admin">' + esc(t('admin')) + '</option></select></div><div class="fg"><label>' + esc(t('branch')) + '</label><select id="sfB">' + branchOpts('') + '</select></div></div><div class="err" id="sfE"></div><div class="acts"><button class="btn gray" onclick="closeDlg()">' + esc(t('cancel')) + '</button><button class="btn" id="sfGo">' + esc(t('save')) + '</button></div>');
  $('sfR').onchange = function () { if (this.value === 'admin' && branches.HO) $('sfB').value = 'HO'; };
  $('sfGo').onclick = function () {
    var n = $('sfN').value.trim(), u = $('sfU').value.trim().toLowerCase(), p = $('sfP').value, r = $('sfR').value, b = $('sfB').value;
    if (!n || !b) { $('sfE').textContent = t('needAll'); return; } if (!/^[a-z0-9_]{3,20}$/.test(u)) { $('sfE').textContent = t('userHint'); return; } if (p.length < 6) { $('sfE').textContent = t('pwHint'); return; }
    $('sfGo').disabled = true; var fail = function (m) { $('sfGo').disabled = false; $('sfE').textContent = m || t('failed'); };
    db.ref('login/' + u).once('value').then(function (s) {
      if (s.exists()) { fail(t('userUsed')); return; }
      var email = u + '@' + MAILD;
      return mkAuthUser(email, p).then(function (uid) { var up = {}; up['staff/' + uid] = { name: n, username: u, role: r, branch: b, active: true, at: Date.now() }; up['login/' + u] = { e: email }; return db.ref().update(up); }).then(function () { closeDlg(); toast(t('staffAdded')); loadStaff(); });
    }).catch(function (e) { fail(e && e.code === 'auth/email-already-in-use' ? t('userUsed') : t('failed')); });
  };
}
function staffEdit(uid) {
  var x = staffCache[uid];
  dlg('<h2>' + esc(t('edit')) + '</h2><div class="fg"><label>' + esc(t('name')) + '</label><input id="seN" value="' + esc(x.name) + '"></div><div class="grid2"><div class="fg"><label>' + esc(t('role')) + '</label><select id="seR"><option value="agent"' + (x.role === 'agent' ? ' selected' : '') + '>' + esc(t('agent')) + '</option><option value="admin"' + (x.role === 'admin' ? ' selected' : '') + '>' + esc(t('admin')) + '</option></select></div><div class="fg"><label>' + esc(t('branch')) + '</label><select id="seB">' + branchOpts(x.branch) + '</select></div></div><div class="acts"><button class="btn gray" onclick="closeDlg()">' + esc(t('cancel')) + '</button><button class="btn" id="seGo">' + esc(t('save')) + '</button></div>');
  $('seGo').onclick = function () { if (uid === me.uid && $('seR').value !== 'admin') { toast(t('cantSelf'), false); return; } var up = {}; up['staff/' + uid + '/name'] = $('seN').value.trim() || x.name; up['staff/' + uid + '/role'] = $('seR').value; up['staff/' + uid + '/branch'] = $('seB').value; db.ref().update(up).then(function () { closeDlg(); toast(t('saved')); loadStaff(); }).catch(function () { toast(t('failed'), false); }); };
}
function staffToggle(uid) { if (uid === me.uid) { toast(t('cantSelf'), false); return; } db.ref('staff/' + uid + '/active').set(!staffCache[uid].active).then(loadStaff).catch(function () { toast(t('failed'), false); }); }
function staffPw(uid) {
  var x = staffCache[uid];
  dlg('<h2>' + esc(t('resetPw')) + ' · ' + esc(x.username) + '</h2><div class="fg"><label>' + esc(t('newPw')) + '</label><input id="rpP" type="text"><div class="muted">' + esc(t('pwHint')) + '</div></div><div class="err" id="rpE"></div><div class="acts"><button class="btn gray" onclick="closeDlg()">' + esc(t('cancel')) + '</button><button class="btn" id="rpGo">' + esc(t('save')) + '</button></div>');
  $('rpGo').onclick = function () {
    var p = $('rpP').value; if (p.length < 6) { $('rpE').textContent = t('pwHint'); return; } $('rpGo').disabled = true;
    var email = x.username + '.' + Math.random().toString(36).slice(2, 7) + '@' + MAILD;
    mkAuthUser(email, p).then(function (nu) { var up = {}, rec = Object.assign({}, x); delete rec.uid; up['staff/' + nu] = rec; up['staff/' + uid] = null; up['login/' + x.username] = { e: email }; return db.ref().update(up); }).then(function () { closeDlg(); toast(t('pwDone')); loadStaff(); }).catch(function () { $('rpGo').disabled = false; $('rpE').textContent = t('failed'); });
  };
}
if (typeof document !== 'undefined') document.addEventListener('DOMContentLoaded', boot);

</script>
