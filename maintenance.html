<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>Maintenance Mode</title>
<style>
  :root { --bg:#f1f5f9; --card:#fff; --ink:#0f172a; --mute:#64748b; --line:#e2e8f0; --brand:#0f172a; --green:#16a34a; --amber:#d97706; --red:#dc2626; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Khmer","Khmer OS",sans-serif; }
  body { background:var(--bg); color:var(--ink); min-height:100vh; }
  header { background:var(--brand); color:#fff; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  header h1 { font-size:17px; font-weight:700; }
  .langs { display:flex; gap:6px; }
  .langs button { background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.3); border-radius:6px; padding:4px 10px; font-size:12px; cursor:pointer; }
  .langs button.on { background:#fff; color:var(--brand); font-weight:700; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border-radius:14px; padding:18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(15,23,42,.08); }
  .card h2 { font-size:15px; margin-bottom:6px; }
  .sub { font-size:12.5px; color:var(--mute); line-height:1.5; margin-bottom:12px; }
  label { display:block; font-size:12.5px; font-weight:600; margin:10px 0 4px; }
  input[type=text], input[type=password], textarea { width:100%; padding:10px 12px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px; background:#fff; }
  textarea { resize:vertical; min-height:44px; }
  .btn { border:0; border-radius:9px; padding:11px 18px; font-size:14px; font-weight:600; cursor:pointer; background:var(--brand); color:#fff; }
  .btn.sec { background:#e2e8f0; color:var(--ink); }
  .btn.green { background:var(--green); } .btn.red { background:var(--red); } .btn.amber { background:var(--amber); }
  .btn[disabled] { opacity:.5; cursor:not-allowed; }
  .err { color:var(--red); font-size:13px; margin-top:10px; min-height:18px; }
  .status { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .pill { display:inline-block; padding:5px 14px; border-radius:20px; font-weight:700; font-size:13px; color:#fff; }
  .pill.on { background:var(--red); } .pill.off { background:var(--green); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .grp { font-size:12px; font-weight:700; color:var(--mute); text-transform:uppercase; letter-spacing:.04em; margin:16px 0 6px; }
  .svc { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .svc:last-child { border-bottom:0; }
  .svc .nm { font-size:14px; font-weight:500; flex:1; min-width:150px; }
  .seg { display:inline-flex; border:1px solid #cbd5e1; border-radius:8px; overflow:hidden; }
  .seg button { border:0; background:#fff; padding:7px 12px; font-size:12.5px; cursor:pointer; color:#475569; }
  .seg button + button { border-left:1px solid #cbd5e1; }
  .seg button.sel-open { background:var(--green); color:#fff; } .seg button.sel-view { background:var(--amber); color:#fff; } .seg button.sel-closed { background:var(--red); color:#fff; }
  .exp { border:1px solid #cbd5e1; background:#f8fafc; border-radius:8px; padding:6px 10px; font-size:12.5px; cursor:pointer; color:#334155; }
  .acts { flex-basis:100%; background:#f8fafc; border-radius:10px; padding:4px 12px 8px; margin:4px 0 6px; }
  .acts .svc { padding:6px 0; }
  .acts .nm { font-size:13px; }
  .mini { border:1px solid #cbd5e1; background:#fff; border-radius:7px; padding:4px 10px; font-size:12px; cursor:pointer; margin:6px 6px 0 0; }
  .count { font-size:13px; color:var(--mute); margin:6px 0 2px; }
  .note { font-size:12px; color:var(--mute); margin-top:8px; line-height:1.5; }
  .hide { display:none !important; }
  .toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:#0f172a; color:#fff; padding:9px 18px; border-radius:20px; font-size:13px; z-index:50; }
  .toast.bad { background:var(--red); }
  .check { display:flex; gap:8px; align-items:flex-start; font-size:13px; margin-top:12px; font-weight:500; }
  .check input { margin-top:3px; }
</style>
</head>
<body>
<header>
  <h1 id="hTitle">Maintenance Mode</h1>
  <div class="langs"><button data-l="en">EN</button><button data-l="km">ខ្មែរ</button><button data-l="zh">中文</button></div>
</header>
<main>
  <!-- LOGIN -->
  <section id="loginBox" class="card">
    <h2 data-i="loginTitle"></h2>
    <p class="sub" data-i="loginSub"></p>
    <div id="stepPw">
      <label data-i="user"></label><input type="text" id="u" autocomplete="username" autocapitalize="off">
      <label data-i="pass"></label><input type="password" id="p" autocomplete="current-password">
    </div>
    <div id="stepCode" class="hide">
      <label data-i="code"></label><input type="text" id="c" inputmode="numeric" autocomplete="one-time-code">
      <p class="note" data-i="codeNote"></p>
    </div>
    <div class="err" id="loginErr"></div>
    <div class="row" style="margin-top:10px;"><button class="btn" id="loginBtn" data-i="loginBtn"></button><a href="/" class="btn sec" style="text-decoration:none;" data-i="backBtn"></a></div>
  </section>

  <!-- CONTROL PANEL -->
  <div id="panel" class="hide">
    <section class="card">
      <div class="status">
        <div><div class="sub" style="margin:0 0 4px;" data-i="statusLabel"></div><span id="pill" class="pill off">OFF</span></div>
        <div style="flex:1;"></div>
        <button class="btn green" id="mainBtn"></button>
        <button class="btn sec" id="outBtn" data-i="logout"></button>
      </div>
      <p class="note" id="lastBy"></p>
      <p class="note" data-i="whatItDoes"></p>
    </section>

    <section class="card">
      <h2 data-i="msgTitle"></h2>
      <p class="sub" data-i="msgSub"></p>
      <label>English</label><textarea id="m_en" rows="2"></textarea>
      <label>ខ្មែរ</label><textarea id="m_km" rows="2"></textarea>
      <label>中文</label><textarea id="m_zh" rows="2"></textarea>
      <label data-i="alignTitle"></label>
      <div class="seg" id="alignSeg"><button type="button" data-a="left" data-i="alignLeft"></button><button type="button" data-a="center" data-i="alignCenter"></button></div>
    </section>

    <section class="card">
      <h2 data-i="acctTitle"></h2>
      <p class="sub" data-i="acctSub"></p>
      <div id="acctList"></div>
    </section>

    <section class="card">
      <h2 data-i="svcTitle"></h2>
      <p class="sub" data-i="svcSub"></p>
      <div class="row">
        <button class="btn sec" id="allOpen" data-i="allOpen"></button>
        <button class="btn red" id="allClosed" data-i="allClosed"></button>
      </div>
      <div class="count" id="count"></div>
      <div id="list"></div>
      <div class="row" style="margin-top:16px;"><button class="btn" id="saveBtn" data-i="save"></button><span class="note" id="dirtyNote"></span></div>
    </section>
  </div>
</main>
<div id="toast" class="toast hide"></div>

              const b = document.createElement('button'); b.type = 'button'; b.textContent = T(k); if ((m === 'closed') === isC) b.className = 'sel-' + m;
              b.onclick = () => { readForm(); form.actions = form.actions || {}; form.actions[x.id] = form.actions[x.id] || {}; if (m === 'closed') form.actions[x.id][a.id] = 'closed'; else delete form.actions[x.id][a.id]; markDirty(); };
              sg.appendChild(b);
            });
            r2.appendChild(sg); box.appendChild(r2);
          });
        }
        list.appendChild(box);
      }
    });
  });
  const c = counts(); $('count').textContent = T('counts', { a: c.open, b: c.btn, c: c.closed });
  $('dirtyNote').textContent = dirty ? T('unsaved') : '';
  $('saveBtn').disabled = !dirty;
}
['m_en', 'm_km', 'm_zh'].forEach(id => $(id).addEventListener('input', () => { if (!form) return; readForm(); dirty = true; $('saveBtn').disabled = false; $('dirtyNote').textContent = T('unsaved'); }));
$('allOpen').onclick = () => { readForm(); SERVICES.forEach(x => form.services[x.id] = 'open'); form.actions = {}; dirty = true; renderPanel(); };
$('allClosed').onclick = () => { readForm(); SERVICES.forEach(x => form.services[x.id] = 'closed'); dirty = true; renderPanel(); };
function toast(msg, bad) { const t = $('toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hide'), 3500); }
function cleanActions() { const o = {}; ACTIONS.forEach(a => { if (form.actions && form.actions[a.s] && form.actions[a.s][a.id] === 'closed' && form.services[a.s] !== 'closed') { o[a.s] = o[a.s] || {}; o[a.s][a.id] = 'closed'; } }); return o; }
async function writeState(on) {
  readForm();
  const msg = {}; ['en', 'km', 'zh'].forEach(l => msg[l] = String(form.message[l] || '').trim());
  const data = { on: !!on, message: msg, bypassKeys: Object.keys(form.bypassKeys || {}).reduce((o, k) => { if (form.bypassKeys[k]) o[k] = true; return o; }, {}), services: Object.assign({}, form.services), actions: cleanActions(), align: form.align === 'center' ? 'center' : 'left', by: (account && (account.name || account.username)) || 'admin', at: firebase.database.ServerValue.TIMESTAMP };
  await db.ref('maintenance').set(data);
}
$('saveBtn').onclick = async () => {
  try { await writeState(!!(cur && cur.on)); dirty = false; toast(T('saved')); } catch (e) { console.error(e); toast(T('saveFail'), true); }
  renderPanel();
};
$('mainBtn').onclick = async () => {
  const on = !!(cur && cur.on);
  readForm(); const none = !on && !Object.keys(form.bypassKeys || {}).some(k => form.bypassKeys[k]);
  if (!confirm(T(on ? 'confirmOff' : 'confirmOn') + (none ? '\n\n' + T('acctNone') : ''))) return;
  try {
    if (on) { readForm(); await db.ref('maintenance').update({ on: false, by: (account && (account.name || account.username)) || 'admin', at: firebase.database.ServerValue.TIMESTAMP }); toast(T('savedOff')); }
    else { await writeState(true); toast(T('savedOn')); }
    dirty = false;
  } catch (e) { console.error(e); toast(T('saveFail'), true); }
  renderPanel();
};
/* always start logged out */
(async () => { try { await auth.signOut(); } catch (e) {} try { await auth.signInAnonymously(); } catch (e) {} })();
renderLang();
</script>
