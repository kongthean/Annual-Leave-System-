<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Track your parcel - Cambodia Insight Express</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Khmer","Khmer OS System","Noto Sans SC","Microsoft YaHei",sans-serif;background:#eef2f7;color:#0f172a;font-size:15px;-webkit-text-size-adjust:100%}
header{background:linear-gradient(135deg,#0b1d3a 0%,#24406e 100%);color:#fff;padding:14px;display:flex;align-items:center;gap:10px}
header b{flex:1;font-size:17px}
header select{padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);font-size:12px}
header select option{color:#0f172a}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(15,23,42,.07);margin-bottom:14px}
h1{font-size:18px;margin:0 0 4px}.muted{color:#64748b;font-size:13px}
.srch{display:flex;gap:8px;margin-top:12px}
input{flex:1;min-width:0;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;text-transform:uppercase}
button{padding:12px 18px;border:0;border-radius:10px;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(135deg,#0b1d3a 0%,#24406e 100%);cursor:pointer}
.no{font-size:20px;font-weight:900;letter-spacing:.5px}
.route{font-size:16px;font-weight:700;margin:6px 0}
.st{display:inline-block;padding:6px 14px;border-radius:16px;color:#fff;font-weight:800;font-size:14px}
.tl{border-left:3px solid #cbd5e1;margin:14px 0 0 6px;padding-left:16px}
.tl .it{position:relative;padding:0 0 16px}
.tl .it:before{content:"";position:absolute;left:-23px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--c,#64748b)}
.tl .it.first:before{box-shadow:0 0 0 4px rgba(37,99,235,.2)}
.tl b{font-size:15px}.tl .m{color:#64748b;font-size:13px}
.err{color:#b91c1c;font-weight:600}
.hide{display:none}
</style>
</head>
<body>
<header><b>Cambodia Insight Express</b><select id="lang"><option value="en">EN</option><option value="km">ខ្មែរ</option><option value="zh">中文</option></select></header>
<main>
 <div class="card"><h1 data-t="title">Track your parcel</h1><div class="muted" data-t="sub">Type the tracking number on your receipt or label.</div>
  <div class="srch"><input id="no" placeholder="PP-261021-0001" autocapitalize="characters" autocomplete="off"><button id="go" data-t="track">Track</button></div></div>
 <div id="res"></div>
</main>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
var FBCFG = {"apiKey": "AIzaSyCSf1S0LwPx-u88Ck9pmXKnEZGy-GmkVwM", "authDomain": "express-cambodiainsight.firebaseapp.com", "databaseURL": "https://express-cambodiainsight-default-rtdb.asia-southeast1.firebasedatabase.app", "projectId": "express-cambodiainsight", "storageBucket": "express-cambodiainsight.firebasestorage.app", "messagingSenderId": "686232697697", "appId": "1:686232697697:web:331abc71da33c4e1b32320"};
var D = {
 en: { title: 'Track your parcel', sub: 'Type the tracking number on your receipt or label.', track: 'Track', notfound: 'We could not find this number. Please check it and try again.', neterr: 'Network problem. Please try again.', setup: 'Tracking is not available yet.', status: 'Current status', hist: 'Journey', upd: 'Last update', s: { received: 'Received', transit: 'On the way', arrived: 'Arrived at destination branch', out: 'Out for delivery', delivered: 'Delivered', problem: 'Problem / Returned' }, from: 'From', to: 'To' },
 km: { title: 'តាមដានកញ្ចប់របស់អ្នក', sub: 'សូមវាយលេខតាមដានដែលមាននៅលើបង្កាន់ដៃ ឬស្លាក។', track: 'តាមដាន', notfound: 'រកមិនឃើញលេខនេះទេ។ សូមពិនិត្យម្តងទៀត។', neterr: 'បញ្ហាបណ្តាញ។ សូមព្យាយាមម្តងទៀត។', setup: 'ការតាមដានមិនទាន់អាចប្រើបានទេ។', status: 'ស្ថានភាពបច្ចុប្បន្ន', hist: 'ដំណើរ', upd: 'ធ្វើបច្ចុប្បន្នភាពចុងក្រោយ', s: { received: 'បានទទួល', transit: 'កំពុងធ្វើដំណើរ', arrived: 'បានមកដល់សាខាទទួល', out: 'កំពុងដឹកជូន', delivered: 'បានប្រគល់', problem: 'បញ្ហា / ត្រឡប់មកវិញ' }, from: 'ពី', to: 'ទៅ' },
 zh: { title: '查询您的包裹', sub: '请输入收据或标签上的运单号。', track: '查询', notfound: '未找到此单号，请检查后重试。', neterr: '网络问题，请重试。', setup: '暂时无法查询。', status: '当前状态', hist: '运输记录', upd: '最近更新', s: { received: '已收件', transit: '运输中', arrived: '已到达目的网点', out: '派送中', delivered: '已签收', problem: '异常 / 退回' }, from: '发自', to: '寄往' }
};
var SC = { received: '#2563eb', transit: '#7c3aed', arrived: '#0d9488', out: '#d97706', delivered: '#16a34a', problem: '#dc2626' };
var LANG = 'en'; try { LANG = localStorage.getItem('xpLang') || 'en'; } catch (e) {} if (!D[LANG]) LANG = 'en';
function T() { return D[LANG]; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fmt(ts) { try { return new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Phnom_Penh', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(ts)); } catch (e) { return ''; } }
var db = null, lastRec = null;
try { if (FBCFG && FBCFG.apiKey) { firebase.initializeApp(FBCFG); db = firebase.database(); } } catch (e) {}
function lang() {
  document.documentElement.lang = LANG; try { localStorage.setItem('xpLang', LANG); } catch (e) {}
  document.getElementById('lang').value = LANG;
  document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = T()[el.getAttribute('data-t')]; });
  if (lastRec) show(lastRec.no, lastRec.r); else if (lastMsg) msg(lastMsg);
}
var lastMsg = '';
function msg(k) { lastMsg = k; lastRec = null; document.getElementById('res').innerHTML = '<div class="card err">' + esc(T()[k]) + '</div>'; }
function show(no, r) {
  lastRec = { no: no, r: r }; lastMsg = '';
  var h = r.hist ? Object.keys(r.hist).map(function (k) { return r.hist[k]; }).sort(function (a, b) { return b.at - a.at; }) : [];
  var s = T().s, st = r.status;
  var html = '<div class="card"><div class="no">' + esc(no) + '</div><div class="route">' + esc(r.from) + ' &rarr; ' + esc(r.to) + '</div><div class="muted">' + esc(T().status) + '</div><div style="margin:6px 0 4px"><span class="st" style="background:' + (SC[st] || '#64748b') + '">' + esc(s[st] || st) + '</span></div><div class="muted">' + esc(T().upd) + ': ' + esc(fmt(r.updated || r.created)) + '</div></div>';
  html += '<div class="card"><b>' + esc(T().hist) + '</b><div class="tl">' + h.map(function (x, i) { return '<div class="it' + (i === 0 ? ' first' : '') + '" style="--c:' + (SC[x.s] || '#64748b') + '"><b>' + esc(s[x.s] || x.s) + '</b><div class="m">' + esc(fmt(x.at)) + (x.place ? ' · ' + esc(x.place) : '') + '</div>' + (x.note ? '<div class="m">' + esc(x.note) + '</div>' : '') + '</div>'; }).join('') + '</div></div>';
  document.getElementById('res').innerHTML = html;
}
function lookup(no) {
  no = String(no || '').trim().toUpperCase(); if (!no) return;
  if (!db) { msg('setup'); return; }
  if (!/^[A-Z0-9]{2,6}-\d{6}-\d{4,}$/.test(no)) { msg('notfound'); return; }
  document.getElementById('no').value = no;
  db.ref('track/' + no).once('value').then(function (s) { var r = s.val(); if (!r) msg('notfound'); else show(no, r); }).catch(function () { msg('neterr'); });
}
document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('go').onclick = function () { lookup(document.getElementById('no').value); };
  document.getElementById('no').onkeydown = function (e) { if (e.key === 'Enter') lookup(this.value); };
  document.getElementById('lang').onchange = function () { LANG = this.value; lang(); };
  lang();
  var m = location.search.match(/[?&]no=([A-Za-z0-9-]+)/); if (m) lookup(m[1]);
});
</script>
</body>
</html>
