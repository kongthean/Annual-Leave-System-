<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check Eligibility</title>
  <style>
    :root {
      --primary-color: #0066cc;
      --primary-hover: #0052a3;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #dcdfe6;
      --error-color: #dc3545;
      --success-color: #28a745;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Kantumruy Pro", "Noto Sans Khmer", "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      padding: 32px;
      width: 100%;
      max-width: 420px;
    }

    .lang-switcher {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 16px;
    }

    .lang-btn {
      background: none;
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .lang-btn.active {
      background-color: var(--primary-color);
      color: #fff;
      border-color: var(--primary-color);
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #111111;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      color: #555555;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-wrapper input:focus {
      border-color: var(--primary-color);
    }

    /* Placeholder stays visual-only */
    .input-wrapper input::placeholder {
      color: #a0aec0;
      font-style: italic;
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    button.btn-submit {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: var(--primary-color);
      color: #ffffff;
    }

    button.btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .result-box {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .result-box.error {
      display: block;
      background-color: #fff5f5;
      color: var(--error-color);
      border: 1px solid #feb2b2;
    }

    .result-box.success {
      display: block;
      background-color: #f0fff4;
      color: var(--success-color);
      border: 1px solid #9ae6b4;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Language Switcher Bar -->
    <div class="lang-switcher">
      <button type="button" class="lang-btn active" onclick="switchLanguage('en')">EN</button>
      <button type="button" class="lang-btn" onclick="switchLanguage('km')">ខ្មែរ</button>
      <button type="button" class="lang-btn" onclick="switchLanguage('zh')">中文</button>
    </div>

    <h2 class="card-title" id="uiTitle">Check Eligibility</h2>

    <form id="eligibilityForm" onsubmit="event.preventDefault(); processEligibility();">
      <div class="form-group">
        <label for="eligibilityAmount" id="uiLabel">Check Eligibility</label>
        <div class="input-wrapper">
          <!-- Always empty value, placeholder changes per language -->
          <input 
            type="text" 
            id="eligibilityAmount" 
            name="eligibility_amount" 
            placeholder="e.g. 200000" 
            value="" 
            autocomplete="off" 
            oninput="formatInputWithCommas(this)"
          />
        </div>
      </div>

      <div class="button-group">
        <button type="submit" class="btn-submit" id="uiBtnSubmit">Check Now</button>
      </div>
    </form>

    <div id="resultBox" class="result-box"></div>
  </div>

  <script>
    // Multilingual Dictionary
    const i18n = {
      en: {
        title: "Check Eligibility",
        label: "Check Eligibility",
        placeholder: "e.g. 200000",
        btnSubmit: "Check Now",
        errEmpty: "Please enter an amount to check eligibility.",
        errInvalid: "Please enter a valid amount greater than 0.",
        successMsg: "Submitted amount: ",
        checkingMsg: "Checking eligibility..."
      },
      km: {
        title: "ពិនិត្យលក្ខខណ្ឌវិនិច្ឆ័យ",
        label: "ពិនិត្យលក្ខខណ្ឌវិនិច្ឆ័យ",
        placeholder: "ឧទាហរណ៍ 200000",
        btnSubmit: "ពិនិត្យឥឡូវនេះ",
        errEmpty: "សូមបញ្ចូលចំនួនទឹកប្រាក់ដើម្បីពិនិត្យលក្ខខណ្ឌ។",
        errInvalid: "សូមបញ្ចូលចំនួនទឹកប្រាក់ដែលត្រឹមត្រូវធំជាង 0។",
        successMsg: "ចំនួនទឹកប្រាក់ដែលបានបញ្ចូល៖ ",
        checkingMsg: "កំពុងពិនិត្យលក្ខខណ្ឌ..."
      },
      zh: {
        title: "检查资格",
        label: "检查资格",
        placeholder: "例如 200000",
        btnSubmit: "立即检查",
        errEmpty: "请输入金额以检查资格。",
        errInvalid: "请输入大于0的有效金额。",
        successMsg: "已提交金额：",
        checkingMsg: "正在检查资格..."
      }
    };

    let currentLang = 'en';

    // Function to switch active language dynamically
    function switchLanguage(lang) {
      currentLang = lang;

      // Update button active states
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      // Update Text Elements
      document.getElementById('uiTitle').textContent = i18n[lang].title;
      document.getElementById('uiLabel').textContent = i18n[lang].label;
      document.getElementById('uiBtnSubmit').textContent = i18n[lang].btnSubmit;
      
      // Update Placeholder without modifying input value
      document.getElementById('eligibilityAmount').placeholder = i18n[lang].placeholder;
      
      // Clear output message on language change
      const resultBox = document.getElementById('resultBox');
      resultBox.style.display = 'none';
    }

    // Auto-format numbers with commas as user types
    function formatInputWithCommas(input) {
      let rawValue = input.value.replace(/\D/g, '');
      if (rawValue) {
        input.value = Number(rawValue).toLocaleString('en-US');
      } else {
        input.value = '';
      }
    }

    // Submission logic
    function processEligibility() {
      const input = document.getElementById('eligibilityAmount');
      const cleanValue = input.value.replace(/,/g, '').trim();

      if (!cleanValue) {
        showResult(i18n[currentLang].errEmpty, 'error');
        return;
      }

      const amount = parseFloat(cleanValue);

      if (isNaN(amount) || amount <= 0) {
        showResult(i18n[currentLang].errInvalid, 'error');
        return;
      }

      showResult(`${i18n[currentLang].successMsg} $${amount.toLocaleString('en-US')}. ${i18n[currentLang].checkingMsg}`, 'success');
    }

    function showResult(message, type) {
      const resultBox = document.getElementById('resultBox');
      resultBox.textContent = message;
      resultBox.className = `result-box ${type}`;
    }
  </script>

</body>
</html>
